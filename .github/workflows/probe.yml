name: Probe careers pages
on:
  push:
    paths: ["probe.txt", "probe.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: job-watch
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.47.0 pyyaml
      - run: python -m playwright install --with-deps chromium
      - run: python probe.py
      - run: |
          git config user.name "job-watch-bot"
          git config user.email "job-watch-bot@users.noreply.github.com"
          git add data/probe.json
          git diff --cached --quiet || git commit -m "Probe results"
          git pull --rebase
          git push
