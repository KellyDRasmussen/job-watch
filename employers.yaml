# Employer watchlist for Kelly's Job Radar.
# Fields:
#   name        employer name
#   url         careers / vacancies listing page
#   global      true = big employer hiring worldwide: keep only ads that mention Denmark / Aarhus / Copenhagen / remote
#   all_titles  true = small org: keep every role, skip the title keyword filter
#   link_regex  optional: only links whose URL matches this regex count as job ads
#   area        aarhus / copenhagen / remote (for the human reading the results)

employers:
  # ---------- Aarhus area ----------
  - name: Vestas
    url: https://careers.vestas.com/search/?q=&locationsearch=Denmark
    global: true
    area: aarhus
